<!doctype html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/shared/vendor/xpcss/XP.css">
  <link rel="stylesheet" href="css/app.css">
  <title>Tracks</title>
  <script src="scripts/app.js" defer></script>
</head>


<body>
  <div id="controls">
    <label id="trackTitle" for="audio">Placeholder 1</label>

    <br>

    <div id="audioContainer">
      <label id="currentTime" for="progressBar">0:00</label>
      <div id="progressContainer">
        <audio id="audio">
          <source src="audios/placeholder.mp3">
        </audio>
        <div id="progressBar"></div>
      </div>
      <label id="duration" for="progressBar"></label>
    </div>

    <div id="buttons"> 
      <button id="prevBtn">Previous</button>
      <button id="playBtn">Play</button>
      <button id="nextBtn">Next</button>
    </div>
    
  </div>

  
  
</body>

</html>
