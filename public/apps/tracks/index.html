<!doctype html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/shared/vendor/xpcss/XP.css">
  <link rel="stylesheet" href="css/app.css">
  <title>Tracks</title>
  <script src="scripts/app.js" defer></script>
</head>


<body>
  <div id="playlist"> 
    <button id="trackSortBtn">Tracks</button>
    <ol id="trackList"></ol> <!-- Clickable tracks are added in JS -->
  </div> 

  <div id="controls">
    <label id="trackTitle" for="audio"></label>

    <br>

    <div id="audioContainer">
      <label id="currentTime" for="progressBar">--:--</label>
      <div id="progressContainer">
        <audio id="audio"></audio>
        <div id="progressBar"></div>
      </div>
      <label id="duration" for="progressBar">--:--</label>
    </div>


    <div id="songControls"> 
      <button id="prevBtn" disabled>Previous</button>
      <button id="playBtn" disabled>Play</button>
      <button id="nextBtn" disabled>Next</button>
    </div>
    
    
  </div>

  
  
</body>

</html>
